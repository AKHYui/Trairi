[package]
name = "trairi"
version = "0.3.3"
edition = "2024"
description = "A single-binary reverse proxy and WireGuard overlay networking tool written in Rust"
license = "MIT"
repository = "https://github.com/AKHYui/Trairi"
readme = "README.md"
keywords = ["reverse-proxy", "tunnel", "wireguard", "overlay", "nat-traversal"]
categories = ["network-programming", "command-line-utilities"]

[dependencies]
anyhow = "1.0.104"
async-trait = "0.1.92"
base64 = "0.22"
boringtun = "0.7.1"
bytes = "1.12.1"
chacha20poly1305 = "0.10"
clap = { version = "4.6.7", features = ["derive"] }
futures = "0.3.34"
futures-util = "0.3.34"
hkdf = "0.12"
hmac = "0.12"
ipnet = "2.12.2"
rand = "0.8"
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12", "logging"] }
rustls-pemfile = "2.2.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
serde_norway = "0.9.42"
sha2 = "0.10"
smux = "0.2.0"
snap = "1.1.2"
subtle = "2.6.1"
thiserror = "2.0.21"
tiny_http = "0.12.0"
tokio = { version = "1.54.1", features = ["full"] }
tokio_kcp = "0.9.8"
tokio-rustls = { version = "0.26.6", default-features = false, features = ["ring", "tls12", "logging"] }
tokio-tungstenite = { version = "0.30.0", features = ["connect", "handshake", "rustls-tls-webpki-roots"] }
tokio-util = { version = "0.7.20", features = ["io"] }
tracing = { version = "0.1.44", features = ["log"] }
tracing-appender = "0.2.5"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
webpki-roots = "1.0.11"

[target.'cfg(not(target_os = "android"))'.dependencies]
tun = { version = "0.8.14", features = ["async"] }

[target.'cfg(target_os = "android")'.dependencies]
libc = "0.2"
